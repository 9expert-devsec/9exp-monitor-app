name: monitor

# Runs the checker every 5 minutes. GitHub's scheduler is best-effort and can
# lag under load, which is exactly why the dashboard renders anything older than
# 15 minutes as `stale` rather than trusting the last known status.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger health checks
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          response=$(mktemp)
          status=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 120 \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-cron-secret: ${CRON_SECRET}" \
            --header 'content-type: application/json' \
            "${MONITOR_URL}/api/checks/run")

          echo "HTTP ${status}"
          cat "$response"
          echo

          # A broken checker has to be visible in the Actions tab, not silently
          # green with a 500 body.
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Checker returned HTTP ${status}"
            exit 1
          fi
