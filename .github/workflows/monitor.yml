name: monitor

# Manual runs only. The 5-minute schedule now lives in Supabase pg_cron, job
# `monitor-checker` (supabase/migrations/20261125100000_checker_cron.sql):
# GitHub's scheduler fired this workflow only a few times a day. Use
# "Run workflow" here to trigger one check run by hand.
on:
  workflow_dispatch:

concurrency:
  group: monitor-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger health checks
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          response=$(mktemp)
          status=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 120 \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-cron-secret: ${CRON_SECRET}" \
            --header 'content-type: application/json' \
            "${MONITOR_URL}/api/checks/run")

          echo "HTTP ${status}"
          cat "$response"
          echo

          # A broken checker has to be visible in the Actions tab, not silently
          # green with a 500 body.
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Checker returned HTTP ${status}"
            exit 1
          fi
